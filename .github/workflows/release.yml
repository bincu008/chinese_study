name: Release zip

# Khi một Release được tạo trên GitHub, tự động đóng gói trang web thành file zip và đính kèm vào Release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist/chinese_study
          cp -r index.html css js README.md dist/chinese_study/
          cd dist && zip -qr "chinese_study-${TAG}.zip" chinese_study
          gh release upload "$TAG" "chinese_study-${TAG}.zip" --clobber
